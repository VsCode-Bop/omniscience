<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OmniScience</title>
    <meta
      name="description"
      content="OmniScience : simulateur de circuits, grapheuse et outils interactifs open source pour enseigner les mathématiques et la physique-chimie. Fonctionne hors-ligne, sans compte, sans serveur."
    />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // Applique le thème avant le premier rendu (évite le flash clair → sombre).
      (function () {
        try {
          var pref = localStorage.getItem('omni:theme') || 'auto';
          var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
      // Diagnostic de déploiement : si GitHub Pages publie le code source brut (source
      // « Deploy from a branch »), le module /src/main.ts est introuvable : on explique quoi faire
      // au lieu d'afficher une page blanche. Le site compilé ne charge jamais de fichier .ts.
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (!t || t.tagName !== 'SCRIPT' || !/\.ts($|\?)/.test(t.src || '')) return;
          var box = document.createElement('div');
          box.setAttribute('role', 'alert');
          box.style.cssText =
            'max-width:40rem;margin:4rem auto;padding:1.5rem;font:16px/1.55 system-ui,sans-serif;border:1px solid #f59e0b;border-radius:12px;background:#fffbeb;color:#1f2937';
          box.innerHTML =
            '<h1 style="font-size:1.3rem;margin:0 0 .6rem">Le site n\'a pas été compilé</h1>' +
            '<p>GitHub Pages publie le code source brut au lieu du site construit par le workflow.</p>' +
            '<p><b>Correction :</b> dans le dépôt GitHub, <b>Settings → Pages → Build and deployment → Source : « GitHub Actions »</b>, ' +
            'puis onglet <b>Actions</b> → « CI &amp; déploiement GitHub Pages » → <b>Run workflow</b>.</p>';
          (document.getElementById('app') || document.body).appendChild(box);
        },
        true,
      );
    </script>
  </head>
  <body>
    <a class="skip-link" href="#view">Aller au contenu</a>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">
        OmniScience est une application interactive : JavaScript doit être activé.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
