# Vérifie chaque contribution (types + tests + build) et publie sur GitHub Pages à chaque
# push sur la branche par défaut du dépôt (quel que soit son nom : main, master…).
# Réglage unique : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
# (Avec « Deploy from a branch », GitHub publierait le code source brut : page blanche.)
name: CI & déploiement GitHub Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires
        run: npm test
      - name: Build (vérification des types incluse)
        run: npm run build
        env:
          # Site de projet servi sous https://<compte>.github.io/<dépôt>/ ; mettre « / » avec un domaine personnalisé.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
